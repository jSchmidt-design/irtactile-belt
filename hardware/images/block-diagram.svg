<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" width="1000" height="745" role="img"
     aria-label="Block diagram of the irTactile belt controller: a host PC feeds an ESP32 over USB, the ESP32 drives a GP8413 DAC whose two outputs are the torque command for two AASD-15A servo drives; encoder feedback returns through four RS-485 to TTL receivers into the ESP32 pulse counters; a safety switch cuts the relay input supply and an init switch arms the system.">
  <style>
    .bg      { fill: #ffffff; }
    .wire    { fill: none; stroke: #4a4a4a; stroke-width: 1.8; }
    .head    { fill: #4a4a4a; }
    .box     { stroke-width: 1.6; }
    .b-host  { fill: #eef1f5; stroke: #6b7a8d; }
    .b-mcu   { fill: #e6eefb; stroke: #3a6ea8; }
    .b-inner { fill: #d5e3f7; stroke: #3a6ea8; stroke-dasharray: 4 3; }
    .b-dac   { fill: #e4f4e9; stroke: #3d8b56; }
    .b-drive { fill: #fbe9e7; stroke: #b8483a; }
    .b-safe  { fill: #fdf0d9; stroke: #c08a12; }
    .b-aux   { fill: #f2f2f0; stroke: #7a7a76; }
    .t       { fill: #17170f; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title   { font-size: 15px; font-weight: 600; }
    .sub     { font-size: 11.5px; fill: #55554e; }
    .lbl     { font-size: 11px; fill: #3d3d38; }
    .lbl-b   { font-size: 11px; font-weight: 600; fill: #3d3d38; }
    @media (prefers-color-scheme: dark) {
      .bg      { fill: #17170f; }
      .wire    { stroke: #a8a89e; }
      .head    { fill: #a8a89e; }
      .b-host  { fill: #23262b; stroke: #8896a6; }
      .b-mcu   { fill: #1b2838; stroke: #6ea0d8; }
      .b-inner { fill: #24384f; stroke: #6ea0d8; }
      .b-dac   { fill: #172c1f; stroke: #63b57e; }
      .b-drive { fill: #331d1a; stroke: #d97a68; }
      .b-safe  { fill: #322813; stroke: #d9ac3c; }
      .b-aux   { fill: #26261f; stroke: #8f8f86; }
      .t       { fill: #f0eee6; }
      .sub     { fill: #b0aea4; }
      .lbl     { fill: #c8c6bc; }
      .lbl-b   { fill: #c8c6bc; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="745"/>

  <!-- host PC -->
  <rect class="box b-host" x="340" y="25" width="180" height="58" rx="5"/>
  <text class="t title" x="430" y="49" text-anchor="middle">host PC</text>
  <text class="t sub"   x="430" y="68" text-anchor="middle">host-bridge</text>

  <path class="wire" marker-end="url(#a)" d="M 430 83 L 430 145"/>
  <text class="t lbl" x="440" y="105">USB / CH340</text>
  <text class="t lbl" x="440" y="120">1.2 Mbaud, one-way</text>

  <!-- ESP32 -->
  <rect class="box b-mcu" x="330" y="145" width="220" height="180" rx="6"/>
  <text class="t title" x="440" y="174" text-anchor="middle">ESP32 devkit</text>
  <text class="t sub"   x="440" y="193" text-anchor="middle">USB-powered · 5 V + 3.3 V rails</text>
  <rect class="box b-inner" x="400" y="248" width="132" height="56" rx="4"/>
  <text class="t sub" x="466" y="270" text-anchor="middle">PCNT 0 / PCNT 1</text>
  <text class="t sub" x="466" y="288" text-anchor="middle">pulse counters</text>

  <!-- init switch -->
  <rect class="box b-aux" x="55" y="189" width="155" height="50" rx="5"/>
  <text class="t title" x="132" y="211" text-anchor="middle">init switch</text>
  <text class="t sub"   x="132" y="228" text-anchor="middle">momentary, to GND</text>
  <path class="wire" marker-end="url(#a)" d="M 210 214 L 330 214"/>
  <text class="t lbl-b" x="270" y="208" text-anchor="middle">GPIO 18</text>

  <!-- relay 3 - status report -->
  <rect class="box b-aux" x="55" y="255" width="155" height="50" rx="5"/>
  <text class="t title" x="132" y="277" text-anchor="middle">relay 3</text>
  <text class="t sub"   x="132" y="294" text-anchor="middle">reports the switch</text>
  <path class="wire" marker-end="url(#a)" d="M 210 280 L 330 280"/>
  <text class="t lbl-b" x="270" y="274" text-anchor="middle">GPIO 19</text>

  <!-- safety switch -->
  <rect class="box b-safe" x="55" y="385" width="155" height="62" rx="5"/>
  <text class="t title" x="132" y="411" text-anchor="middle">safety switch</text>
  <text class="t sub"   x="132" y="430" text-anchor="middle">in the 3.3 V input rail</text>
  <path class="wire" marker-end="url(#a)" d="M 132 385 L 132 305"/>
  <path class="wire" marker-end="url(#a)" d="M 210 416 L 330 416"/>
  <text class="t lbl-b" x="270" y="410" text-anchor="middle">3.3 V</text>
  <text class="t lbl"   x="270" y="437" text-anchor="middle">to all 3 relays</text>

  <!-- relays 1 / 2 - servo enable -->
  <rect class="box b-aux" x="330" y="385" width="220" height="62" rx="5"/>
  <text class="t title" x="440" y="411" text-anchor="middle">relay 1 / relay 2</text>
  <text class="t sub"   x="440" y="430" text-anchor="middle">servo enable · isolated</text>
  <path class="wire" marker-end="url(#a)" d="M 440 325 L 440 385"/>
  <text class="t lbl-b" x="450" y="359">GPIO 25 / 13</text>

  <!-- GP8413 DAC -->
  <rect class="box b-dac" x="755" y="175" width="180" height="80" rx="6"/>
  <text class="t title" x="845" y="205" text-anchor="middle">GP8413 DAC</text>
  <text class="t sub"   x="845" y="224" text-anchor="middle">dual 15-bit, 0–10 V</text>
  <text class="t sub"   x="845" y="241" text-anchor="middle">I²C address 0x58</text>
  <path class="wire" marker-end="url(#a)" d="M 550 205 L 755 205"/>
  <text class="t lbl-b" x="652" y="199" text-anchor="middle">I²C · 1 MHz</text>

  <path class="wire" marker-end="url(#a)" d="M 845 255 L 845 530"/>
  <text class="t lbl-b" x="855" y="378">VOUT0 / VOUT1</text>
  <text class="t lbl"   x="855" y="394">torque command → Vref</text>

  <!-- RS-485 to TTL receivers -->
  <rect class="box b-aux" x="615" y="385" width="175" height="62" rx="5"/>
  <text class="t title" x="702" y="411" text-anchor="middle">4× RS-485→TTL</text>
  <text class="t sub"   x="702" y="430" text-anchor="middle">line receivers · 3.3 V</text>
  <path class="wire" marker-end="url(#a)" d="M 702 530 L 702 447"/>
  <text class="t lbl-b" x="712" y="486">PA± / PB±</text>
  <text class="t lbl"   x="712" y="501">encoder, differential</text>
  <path class="wire" marker-end="url(#a)" d="M 702 385 L 702 277 L 550 277"/>
  <text class="t lbl-b" x="640" y="270" text-anchor="middle">TTL</text>

  <!-- AASD-15A drives -->
  <rect class="box b-drive" x="330" y="530" width="560" height="80" rx="6"/>
  <text class="t title" x="610" y="562" text-anchor="middle">2× AASD-15A servo drives</text>
  <text class="t sub"   x="610" y="583" text-anchor="middle">torque mode · Vref on CN2-25 · SRV-ON on CN2-6 · encoder out on CN2-17…20</text>
  <path class="wire" marker-end="url(#a)" d="M 440 447 L 440 530"/>
  <text class="t lbl-b" x="450" y="493">SRV-ON</text>
  <path class="wire" marker-end="url(#a)" d="M 155 570 L 330 570"/>
  <text class="t lbl-b" x="242" y="563" text-anchor="middle">220 V mains</text>

  <!-- motors / belts -->
  <rect class="box b-aux" x="490" y="665" width="220" height="58" rx="5"/>
  <text class="t title" x="600" y="689" text-anchor="middle">2× servo motor</text>
  <text class="t sub"   x="600" y="708" text-anchor="middle">mounted opposite-handed</text>
  <path class="wire" marker-end="url(#a)" d="M 600 610 L 600 665"/>
  <text class="t lbl-b" x="610" y="642">U / V / W</text>
  <path class="wire" marker-end="url(#a)" d="M 710 694 L 800 694"/>
  <text class="t title" x="808" y="699">belts</text>
</svg>
